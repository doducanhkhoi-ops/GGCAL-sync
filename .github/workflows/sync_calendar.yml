name: Auto Sync FTU Schedule to Google Calendar

on:
  schedule:
    # 00:00 UTC = 07:00 AM giờ Việt Nam
    - cron: '0 0 * * *'
    # 11:00 UTC = 18:00 PM giờ Việt Nam
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Credentials and Token from Secrets
        shell: bash
        run: |
          echo '${{ secrets.CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.TOKEN_JSON }}' > token.json

      - name: Run Schedule Sync
        env:
          STUDENT_ID: ${{ secrets.STUDENT_ID }}
          STUDENT_PASS: ${{ secrets.STUDENT_PASS }}
        run: |
          python main_sync.py
